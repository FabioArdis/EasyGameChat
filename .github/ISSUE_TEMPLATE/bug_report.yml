name: Bug report
description: Report a reproducible problem.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security issues here. Use [private vulnerability reporting](https://github.com/FabioArdis/EasyGameChat/security/advisories/new) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, code, or a minimal project that reproduces the problem.
      placeholder: |
        1. Start the server with ...
        2. Connect with ...
        3. Send ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server
        - Python client
        - C++ client
        - Protocol
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.4.0 or commit SHA
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, compiler, Python version, or Go version.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, secrets, certificates, and private data.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
        - label: This is not a security vulnerability.
