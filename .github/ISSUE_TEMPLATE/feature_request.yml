name: Feature request
description: Suggest an improvement or integration use case.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem or integration scenario. Do not include secrets or private data.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or API you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds or other designs.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server
        - Python client
        - C++ client
        - Protocol
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
        - label: I can help test this change.
