name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Build
        run: python -m build

  cpp:
    name: C++ (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev nlohmann-json3-dev

      - name: Configure library
        run: cmake -S clients/cpp -B build-lib -DCMAKE_BUILD_TYPE=Release -DEASYGAMECHAT_BUILD_TESTS=ON

      - name: Build library
        run: cmake --build build-lib --parallel

      - name: Test library
        run: ctest --test-dir build-lib --output-on-failure

      - name: Install library
        run: cmake --install build-lib --prefix "$PWD/install"

      - name: Configure consumer
        run: cmake -S clients/cpp/tests/consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/install"

      - name: Build consumer
        run: cmake --build build-consumer --parallel

      - name: Configure example
        run: cmake -S examples/c-cpp -B build-example -DCMAKE_BUILD_TYPE=Release

      - name: Build example
        run: cmake --build build-example --parallel

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: easygamechat:ci
